<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<title>💗 Para Mae jannet ✨</title>

<!-- Fuente romántica para el inicio y el mensaje oculto -->
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: #000;
    perspective: 1000px; 
}

/* --- PANTALLA DE INICIO --- */
#inicio-overlay {
    position: fixed;
    inset: 0;
    background: #050002;
    z-index: 100;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    color: #ff1493;
    font-family: 'Dancing Script', cursive;
    font-size: 2.5rem;
    text-align: center;
    cursor: pointer;
    transition: opacity 1.5s ease;
}

#inicio-overlay p {
    text-shadow: 0 0 20px #ff69b4;
    animation: latido 2s infinite;
    padding: 20px;
}

@keyframes latido {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px #ff1493; }
}

/* --- ELEMENTOS DE FONDO --- */
.elementos-fondo {
    opacity: 0;
    transition: opacity 4s ease-in-out; 
}

/* --- POLVO DE ESTRELLAS --- */
#capa-estrellas {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.estrella {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 10px #fff, 0 0 20px #ffb6c1;
    animation: titilar infinite alternate;
}

@keyframes titilar {
    0% { opacity: 0.2; transform: scale(0.5); }
    100% { opacity: 1; transform: scale(1.5); }
}

/* --- EFECTO MATRIX --- */
.terminal {
    position: fixed;
    inset: 0;
    overflow: hidden;
    z-index: 1;
}

.text-container {
    position: absolute;
    width: 100%;
    color: rgba(255, 20, 147, 0.8);
    font-family: 'Courier New', monospace;
    font-size: 24px;
    text-shadow: 0 0 10px #ff69b4;
    line-height: 1.2;
    animation: matrixGlow 2s infinite;
    mix-blend-mode: screen;
    white-space: nowrap;
}

@keyframes scroll {
    0% { transform: translateY(100vh); }
    100% { transform: translateY(-100%); }
}

/* --- CORAZONES FLOTANTES --- */
.love-container {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
}

.love-text {
    position: absolute;
    color: #ffd7ff;
    font-size: 2rem;
    text-shadow: 0 0 25px rgba(255, 105, 180, 0.8);
    animation: caida 12s linear infinite;
}

@keyframes caida {
    0% { transform: translateY(-10vh) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}

/* --- TARJETA 3D INTERACTIVA (CORREGIDA PARA LA FOTO) --- */
.contenedor-tarjeta {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90vw;
    max-width: 700px; 
    /* Obliga a la tarjeta a ser siempre un rectángulo horizontal */
    aspect-ratio: 16 / 10; 
    z-index: 3;
    perspective: 1000px; 
    opacity: 0;
    transition: opacity 5s ease-in-out, transform 0.1s ease-out; 
    cursor: pointer;
}

.tarjeta-interna {
    width: 100%;
    height: 100%;
    position: relative;
    transition: transform 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
    transform-style: preserve-3d;
}

.volteada {
    transform: rotateY(180deg);
}

.cara {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden; 
    border-radius: 20px;
    box-shadow: 0 0 40px rgba(255, 20, 147, 0.5);
    border: 2px solid rgba(255, 105, 180, 0.6);
    overflow: hidden;
}

/* FRENTE: LA FOTO CORREGIDA */
.cara-frente {
    display: flex;
    justify-content: center;
    align-items: center;
    background: rgba(0, 0, 0, 0.8); /* Fondo oscuro elegante detrás de la foto */
}

.cara-frente img {
    width: 100%;
    height: 100%;
    /* contain asegura que la imagen NUNCA se recorte, mostrando todo el ancho */
    object-fit: contain; 
    border-radius: 18px;
}

/* ATRÁS: EL MENSAJE */
.cara-atras {
    transform: rotateY(180deg);
    background: linear-gradient(135deg, rgba(20, 0, 10, 0.9), rgba(60, 0, 30, 0.9));
    backdrop-filter: blur(10px);
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 30px;
}

.cara-atras p {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2rem, 5vw, 3.5rem); 
    color: #fff;
    text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4;
    line-height: 1.4;
    margin: 0;
}

/* --- PARTÍCULAS EXPLOSIÓN AL TOQUE --- */
.particula-explosion {
    position: absolute;
    pointer-events: none;
    font-size: 1.5rem;
    animation: explotar 0.8s ease-out forwards;
    z-index: 10;
}

@keyframes explotar {
    0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
    100% { transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(1.5); opacity: 0; }
}

.efecto-bloom {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 105, 180, .15) 0%, transparent 70%);
    mix-blend-mode: overlay;
    animation: pulsacionBloom 6s infinite alternate;
    z-index: 1;
    pointer-events: none;
}

@keyframes pulsacionBloom {
    0% { opacity: 0.5; }
    100% { opacity: 0.9; transform: scale(1.1); }
}

/* RESPONSIVE CORREGIDO */
@media (max-width: 768px) {
    #inicio-overlay p { font-size: 1.8rem; }
    .text-container { font-size: 16px; }
    .contenedor-tarjeta { width: 95vw; } /* Se adapta a pantallas pequeñas manteniendo proporción horizontal */
}
</style>
</head>

<body>

<!-- PANTALLA DE INICIO -->
<div id="inicio-overlay">
    <p>✨ Toca para ver tu sorpresa ✨</p>
</div>

<audio id="musica" loop preload="auto">
    <source src="https://cdn.jsdelivr.net/gh/OLV287/archivos@main/Carla%20Morrison%20-%20Disfruto%20(letra).mp3" type="audio/mpeg">
</audio>

<div class="efecto-bloom"></div>

<!-- CONTENEDORES QUE APARECEN CON FADE-IN -->
<div id="elementos-maestros" class="elementos-fondo">
    <div id="capa-estrellas"></div>
    <div class="terminal" id="terminal"></div>
    <div class="love-container" id="loveContainer"></div>
</div>

<!-- TARJETA 3D -->
<div class="contenedor-tarjeta" id="contenedor-tarjeta">
    <div class="tarjeta-interna" id="tarjeta-interna">
        <div class="cara cara-frente">
            <img src="https://raw.githubusercontent.com/OLV287/archivos/d12bc48b360b500a9624433bc3c49ec449adcd24/fts.jpg" alt="Mae Jannet">
        </div>
        <div class="cara cara-atras">
            <p>Con mucho cariño para ti, un recuerdo para tu corazon.</p>
        </div>
    </div>
</div>

<script>
// VARIABLES GLOBALES
const overlay = document.getElementById('inicio-overlay');
const audio = document.getElementById("musica");
const elementosFondo = document.getElementById('elementos-maestros');
const contenedorTarjeta = document.getElementById('contenedor-tarjeta');
const tarjetaInterna = document.getElementById('tarjeta-interna');
let sistemaActivo = false;

// INICIO CINEMATOGRÁFICO
function arrancarExperiencia() {
    if (sistemaActivo) return;
    sistemaActivo = true;

    audio.play().catch(() => {});
    overlay.style.opacity = '0'; 
    
    setTimeout(() => {
        overlay.style.display = 'none'; 
        elementosFondo.style.opacity = '1';
        contenedorTarjeta.style.opacity = '1';
    }, 1500);
}

overlay.addEventListener('click', arrancarExperiencia);
overlay.addEventListener('touchstart', arrancarExperiencia);

// EFECTO DE GIRO DE TARJETA
contenedorTarjeta.addEventListener('click', () => {
    tarjetaInterna.classList.toggle('volteada');
});

// EFECTO TILT 3D
document.addEventListener('mousemove', (e) => {
    if (window.innerWidth < 768) return; 
    let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
    let yAxis = (window.innerHeight / 2 - e.pageY) / -30;
    contenedorTarjeta.style.transform = `translate(-50%, -50%) rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
});

// EXPLOSIÓN AL TOQUE
document.addEventListener('click', (e) => {
    if (e.target.id === 'inicio-overlay' || !sistemaActivo) return;
    
    for (let i = 0; i < 6; i++) {
        const particula = document.createElement('div');
        particula.className = 'particula-explosion';
        particula.textContent = ["💖","✨","💕"][Math.floor(Math.random() * 3)];
        document.body.appendChild(particula);
        
        const angulo = Math.random() * Math.PI * 2;
        const velocidad = Math.random() * 80 + 40;
        const tx = Math.cos(angulo) * velocidad;
        const ty = Math.sin(angulo) * velocidad;
        
        particula.style.left = `${e.pageX}px`;
        particula.style.top = `${e.pageY}px`;
        particula.style.setProperty('--tx', `${tx}px`);
        particula.style.setProperty('--ty', `${ty}px`);
        
        setTimeout(() => particula.remove(), 800);
    }
});

// POLVO DE ESTRELLAS
function initEstrellas() {
    const contenedorEstrellas = document.getElementById('capa-estrellas');
    for (let i = 0; i < 50; i++) {
        const estrella = document.createElement('div');
        estrella.className = 'estrella';
        estrella.style.left = `${Math.random() * 100}vw`;
        estrella.style.top = `${Math.random() * 100}vh`;
        let size = Math.random() * 3 + 1;
        estrella.style.width = `${size}px`;
        estrella.style.height = `${size}px`;
        estrella.style.animationDuration = `${Math.random() * 3 + 1}s`;
        contenedorEstrellas.appendChild(estrella);
    }
}

// LLUVIA MATRIX
function initMatrix() {
    const container = document.getElementById('terminal');
    container.innerHTML = '';
    const LINE_COUNT = window.innerWidth <= 768 ? 15 : 25;
    for (let i = 0; i < LINE_COUNT; i++) {
        const line = document.createElement('div');
        line.className = 'text-container';
        line.style.animation = `scroll ${Math.random() * 3 + 4}s linear infinite`;
        line.style.animationDelay = `${Math.random() * -5}s`; 
        line.textContent = ("Mae jannet ").repeat(Math.ceil(window.innerWidth / 50));
        container.appendChild(line);
    }
}

function initLoveEffect() {
    const container = document.getElementById('loveContainer');
    setInterval(() => {
        const love = document.createElement('div');
        love.className = 'love-text';
        love.style.left = `${Math.random() * 95}vw`;
        love.style.animationDuration = `${Math.random() * 5 + 8}s`;
        love.textContent = ["💗", "❤️", "🌸", "✨"][Math.floor(Math.random() * 4)];
        container.appendChild(love);
        setTimeout(() => love.remove(), 12000);
    }, 300); 
}

// INICIALIZACIÓN
window.addEventListener('load', () => {
    initEstrellas();
    initMatrix();
    initLoveEffect();
});

let resizeTimer;
window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(initMatrix, 200);
});
</script>
</body>
</html>
